services:
  app-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-dev-only
      POSTGRES_DB: goods
    volumes:
      - app-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d goods"]
      interval: 2s
      timeout: 3s
      retries: 20
  supplier-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: supplier
      POSTGRES_PASSWORD: supplier-dev-only
      POSTGRES_DB: supplier_a
    volumes:
      - supplier-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier -d supplier_a"]
      interval: 2s
      timeout: 3s
      retries: 20
  supplier-b-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: supplier
      POSTGRES_PASSWORD: supplier-dev-only
      POSTGRES_DB: supplier_b
    volumes:
      - supplier-b-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier -d supplier_b && psql -U supplier -d supplier_b -c 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate-app:
    build: .
    entrypoint: ["/app/migrate", "-scope", "app"]
    environment:
      DATABASE_URL: postgres://app:app-dev-only@app-db:5432/goods?sslmode=disable
    depends_on:
      app-db:
        condition: service_healthy
  migrate-supplier:
    build: .
    entrypoint: ["/app/migrate", "-scope", "supplier"]
    environment:
      DATABASE_URL: postgres://supplier:supplier-dev-only@supplier-db:5432/supplier_a?sslmode=disable
    depends_on:
      supplier-db:
        condition: service_healthy
  migrate-supplier-b:
    build: .
    entrypoint: ["/app/migrate", "-scope", "supplier-b"]
    environment:
      DATABASE_URL: postgres://supplier:supplier-dev-only@supplier-b-db:5432/supplier_b?sslmode=disable
    depends_on:
      supplier-b-db:
        condition: service_healthy
  supplier:
    build: .
    entrypoint: ["/app/supplier"]
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://supplier:supplier-dev-only@supplier-db:5432/supplier_a?sslmode=disable
      SUPPLIER_AFTER_ISSUE_DELAY: ${SUPPLIER_A_AFTER_ISSUE_DELAY:-}
      SUPPLIER_FORCE_FINAL_UNAVAILABLE: ${SUPPLIER_A_FORCE_FINAL_UNAVAILABLE:-false}
      SUPPLIER_FINAL_UNAVAILABLE_PERCENT: ${SUPPLIER_A_FINAL_UNAVAILABLE_PERCENT:-0}
      SUPPLIER_TRANSIENT_ERROR_PERCENT: ${SUPPLIER_A_TRANSIENT_ERROR_PERCENT:-0}
    depends_on:
      migrate-supplier:
        condition: service_completed_successfully
  supplier-b:
    build: .
    entrypoint: ["/app/supplier"]
    environment:
      HTTP_ADDR: :8082
      DATABASE_URL: postgres://supplier:supplier-dev-only@supplier-b-db:5432/supplier_b?sslmode=disable
      SUPPLIER_AFTER_ISSUE_DELAY: ${SUPPLIER_B_AFTER_ISSUE_DELAY:-}
      SUPPLIER_FORCE_FINAL_UNAVAILABLE: ${SUPPLIER_B_FORCE_FINAL_UNAVAILABLE:-false}
      SUPPLIER_FINAL_UNAVAILABLE_PERCENT: ${SUPPLIER_B_FINAL_UNAVAILABLE_PERCENT:-0}
      SUPPLIER_TRANSIENT_ERROR_PERCENT: ${SUPPLIER_B_TRANSIENT_ERROR_PERCENT:-0}
    depends_on:
      migrate-supplier-b:
        condition: service_completed_successfully
  api:
    build:
      context: .
    environment:
      HTTP_ADDR: :8080
      SHUTDOWN_TIMEOUT: 5s
      DATABASE_URL: postgres://app:app-dev-only@app-db:5432/goods?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate-app:
        condition: service_completed_successfully
  worker:
    build: .
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://app:app-dev-only@app-db:5432/goods?sslmode=disable
      SUPPLIER_URL: http://supplier:8081
      SUPPLIER_B_URL: http://supplier-b:8082
    depends_on:
      migrate-app:
        condition: service_completed_successfully
      supplier:
        condition: service_started
      supplier-b:
        condition: service_started

volumes:
  app-data:
  supplier-data:
  supplier-b-data:
